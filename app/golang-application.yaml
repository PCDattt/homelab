apiVersion: v1
kind: Namespace
metadata:
  name: app

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-application
  namespace: app
  labels:
    app: golang-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golang-application
  template:
    metadata:
      labels:
        app: golang-application
    spec:
      containers:
        - name: golang-application
          image: ghcr.io/pcdattt/homelab:sha-cb2bcde3c044824837818d9d585ce09f3387ee26@sha256:d9681c1fea679e3181a40759b38b5914ef54139b30513b4fb8123745b4edd45a
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: golang-application
  namespace: app
spec:
  type: NodePort
  ports:
    - name: http
      nodePort: 30004
      port: 8080
      protocal: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: golang-application
