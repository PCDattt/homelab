apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-application
  namespace: app
  labels:
    app.kubernetes.io/name: golang-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: golang-application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golang-application
    spec:
      containers:
        - name: golang-application
          image: ghcr.io/pcdattt/homelab:sha-96948ac4363ae08697b3b1d9dac1be6c6194a300
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: golang-application
  namespace: app
  labels:
    prometheus.io/scrape: "true"
spec:
  type: NodePort
  ports:
    - name: http
      nodePort: 30004
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: golang-application
