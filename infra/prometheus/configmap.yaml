apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 20s

    storage:
      tsdb:
        retention:
          time: 90d
          size: 40GB

    scrape_configs:
      - job_name: kubernetes-services
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_prometheus_io_scrape]
            action: keep
            regex: "true"

      - job_name: scaphandre-daemonset
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_prometheus_io_scrape]
            action: keep
            regex: "true"
