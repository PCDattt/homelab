apiVersion: batch/v1
kind: Job
metadata:
  name: unseal-vault
  namespace: job
spec:
  template:
    metadata:
      labels:
        app: unseal-vault
    spec:
      serviceAccountName: unseal-vault
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-vault
          image: registry.k8s.io/kubectl:v1.31.0
          args:
            - wait
            - --namespace=vault
            - --for=condition=Initialized
            - pod/vault-0
            - --timeout=1200s

      containers:
        - name: unseal-vault
          image: hashicorp/vault:1.15
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: UNSEAL_KEY_1
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key:  key-1
            - name: UNSEAL_KEY_2
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key:  key-2
            - name: UNSEAL_KEY_3
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key:  key-3

          command:
            - /bin/sh
            - -c
            - |
              echo "Vault is up, starting to unseal"
              vault operator unseal $UNSEAL_KEY_1
              vault operator unseal $UNSEAL_KEY_2
              vault operator unseal $UNSEAL_KEY_3
              echo "Unseal commands already ran"
