apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
 name: vault-backend
spec:
 provider:
  vault:
   server: "http://vault.vault.svc.cluster.local:8200"
   path: "secret"
   version: "v2"
   auth:
    # have to create vault's key secret first
    tokenSecretRef:
     name: "vault-token"
     key: "token"
     namespace: default
