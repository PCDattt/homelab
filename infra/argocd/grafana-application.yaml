apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
 name: grafana
 namespace: argocd
spec:
 project: default
 source:
  repoURL: https://github.com/PCDattt/homelab
  targetRevision: infrastructure
  path: infra/grafana
 destination:
  server: https://kubernetes.default.svc
 syncPolicy:
  automated:
   enabled: true
